name: Shoppy CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoppy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd apps/backend
          npm ci

      - name: Generate Prisma Client & Run DB Push
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shoppy_test?schema=public"
        run: |
          cd apps/backend
          npx prisma generate
          npx prisma db push

      - name: Run Backend Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shoppy_test?schema=public"
          JWT_ACCESS_SECRET: "ci_test_access_secret_12345"
          JWT_REFRESH_SECRET: "ci_test_refresh_secret_67890"
        run: |
          cd apps/backend
          npm test

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Build frontend
        run: |
          cd apps/frontend
          npm run build
